syntax = "proto3";

package com.feedlytics.service.notification.v1;

option java_multiple_files = true;
option java_package = "com.feedlytics.service.notification.v1";
option java_outer_classname = "InAppNotificationProto";

service InAppNotificationService {
  rpc CreateInAppNotification (CreateInAppNotificationRequest) returns (CreateInAppNotificationResponse);
}

enum NotificationType {
  NOTIFICATION_TYPE_UNSPECIFIED = 0;
  WORKSPACE_INVITE_PENDING = 1;
}

message CreateInAppNotificationRequest {
  int64 recipient_user_id = 1;
  optional int64 workspace_id = 2;
  NotificationType type = 3;
  string dedupe_key = 4;
  string payload_json = 5;
}

message CreateInAppNotificationResponse {
  string public_id = 1;
  int64 id = 2;
  bool created = 3;
}
